# Client authentication for the shared local dev Postgres instance,
# used by both wingtrill-mongooseim and wingtrill-notifier.
#
# The container is started with `ssl=on`, but only MongooseIM's driver
# actually negotiates SSL; wingtrill-notifier's epgsql-based pool connects
# in plain TCP. Accept both here since this is local dev infra only.
#
# TYPE      DATABASE        USER            ADDRESS                 METHOD
local       all             all                                     trust
hostssl     all             all             0.0.0.0/0               md5
hostssl     all             all             ::0/0                   md5
host        all             all             0.0.0.0/0               md5
host        all             all             ::0/0                   md5
