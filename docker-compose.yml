# Prerequisites: generate SSL certs before first run:
#   make -C tools/ssl/
#
# Then start with:
#   docker compose up --build

services:
  # Shared with wingtrill-notifier: it stores its own "wingtrill_notifier"
  # database here (see docker/postgres/init.sh) instead of running its own
  # Postgres container. Keep host ports in sync with that repo's .env.
  postgres:
    image: postgres:16
    user: root
    entrypoint: /docker-init/entrypoint.sh
    command:
      - docker-entrypoint.sh
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/ssl/postgres/cert.pem
      - -c
      - ssl_key_file=/var/ssl/postgres/key.pem
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - ./docker/postgres/entrypoint.sh:/docker-init/entrypoint.sh:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./priv/pg.sql:/docker-init/pg.sql:ro
      - ./tools/ssl/mongooseim/cert.pem:/tmp/ssl/cert.pem:ro
      - ./tools/ssl/mongooseim/key.pem:/tmp/ssl/key.pem:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U mongooseim -d mongooseim -c 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Shared with wingtrill-notifier: mod_event_pusher_rabbit (once enabled)
  # publishes to this vhost, and the notifier consumes from it — so it
  # connects here instead of running its own RabbitMQ container.
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mongooseim
      RABBITMQ_DEFAULT_PASS: secret
      RABBITMQ_DEFAULT_VHOST: mongooseim
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5673:5672"      # AMQP
      - "15673:15672"    # management UI
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  rabbitmq_data: