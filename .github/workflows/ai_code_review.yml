name: AI Code Review Gate

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, edited, labeled, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_call: {}

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  actions: read
  checks: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: 🤖 AI Code Reviewer (OpenCode)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mongooseim
          POSTGRES_PASSWORD: mongooseim_secret
          POSTGRES_DB: wingtrill_notifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mongooseim"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: mongooseim
          RABBITMQ_DEFAULT_PASS: secret
          RABBITMQ_DEFAULT_VHOST: mongooseim
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    if: |
      (
        github.event_name == 'pull_request' &&
        (
          github.event.action == 'opened' ||
          github.event.action == 'synchronize' ||
          github.event.action == 'ready_for_review' ||
          github.event.action == 'reopened' ||
          contains(github.event.pull_request.labels.*.name, 'ready-for-ci') ||
          contains(github.event.pull_request.labels.*.name, 'ai-review')
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          contains(github.event.comment.body, '@ai') ||
          contains(github.event.comment.body, '@review') ||
          contains(github.event.comment.body, '@opencode') ||
          contains(github.event.comment.body, '@claude')
        )
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        (
          contains(github.event.comment.body, '@ai') ||
          contains(github.event.comment.body, '@review') ||
          contains(github.event.comment.body, '@opencode') ||
          contains(github.event.comment.body, '@claude')
        )
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        (
          contains(github.event.review.body, '@ai') ||
          contains(github.event.review.body, '@review') ||
          contains(github.event.review.body, '@opencode') ||
          contains(github.event.review.body, '@claude')
        )
      ) ||
      github.event_name == 'workflow_call'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Perform AI Code Review
        uses: actions/github-script@v7
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request
              ? context.payload.pull_request.number
              : (context.payload.issue ? context.payload.issue.number : null);

            if (!pull_number) {
              console.log('No PR number associated with this trigger event.');
              return;
            }

            // Fetch PR details and raw git diff
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const { data: diff } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
              headers: { accept: 'application/vnd.github.v3.diff' }
            });

            if (!diff || !diff.trim()) {
              console.log('No diff found to review.');
              return;
            }

            // Extract custom user instruction from comment if triggered via comment
            let userInstruction = '';
            if (context.eventName === 'issue_comment' || context.eventName === 'pull_request_review_comment') {
              userInstruction = context.payload.comment.body || '';
            } else if (context.eventName === 'pull_request_review') {
              userInstruction = context.payload.review.body || '';
            }

            // Truncate diff if larger than ~35,000 characters
            const MAX_DIFF_LEN = 35000;
            const truncatedDiff = diff.length > MAX_DIFF_LEN
              ? diff.substring(0, MAX_DIFF_LEN) + '\n\n...[Diff truncated due to max size limit]...'
              : diff;

            const prompt = `You are a Principal Code Reviewer and Security Auditor.
            Perform a thorough, comprehensive review of all code changes in this Pull Request.

            PR Title: ${pr.title}
            PR Description: ${pr.body || 'No description provided.'}
            ${userInstruction ? `User Specific Request: "${userInstruction}"` : ''}

            Code Diff:
            \`\`\`diff
            ${truncatedDiff}
            \`\`\`

            Review structure and requirements:
            1. 📊 **Executive Summary**: 2-sentence summary of the PR scope and code quality.
            2. 🏗️ **Code Patterns & Architecture**: Evaluate design patterns, component structure, state management, separation of concerns, and modularity.
            3. 🔤 **Strings, Constants & Localization**: Identify hardcoded strings, magic numbers, missing constants, or unlocalized UI text.
            4. 🐛 **Bugs & Edge Cases**: Flag potential runtime exceptions, unhandled promises, null/undefined safety, race conditions, or logic errors.
            5. ⚡ **Performance & Memory**: Check for unnecessary re-renders, missing memoization (useMemo/useCallback), unoptimized loops/lists, or memory leaks.
            6. 🔷 **TypeScript & Code Quality**: Check strict type safety, usage of 'any', interface correctness, naming conventions, and dead code.
            7. 🔒 **Security & Data Handling**: Verify secret safety, input validation, secure storage, and API error handling.
            8. 🚀 **Feature Recommendations & Next Steps**: Provide clear suggestions on additional features, improvements, or enhancements that can be implemented despite current code state.
            9. 💡 **Actionable Code Refactoring**: Provide concrete code diff suggestions with file names and line numbers where appropriate.`;

            let reviewContent = '';
            let apiErrors = [];
            let usedModelName = '';
            const opencodeKey = process.env.OPENCODE_API_KEY;
            const anthropicKey = process.env.ANTHROPIC_API_KEY;

            if (opencodeKey) {
              const opencodeEndpoints = [
                'https://opencode.ai/zen/go/v1',
                'https://opencode.ai/zen/v1',
                'https://opencode.ai/api/v1',
                'https://api.opencode.ai/v1',
                'https://api.openai.com/v1'
              ];

              for (const baseUrl of opencodeEndpoints) {
                if (reviewContent) break;

                let modelsToTry = [];
                // Query server's /models endpoint to dynamically get active model IDs
                try {
                  const modelRes = await fetch(`${baseUrl}/models`, {
                    headers: { 'Authorization': `Bearer ${opencodeKey.trim()}` }
                  });
                  if (modelRes.ok) {
                    const modelData = await modelRes.json();
                    if (modelData.data && Array.isArray(modelData.data)) {
                      modelsToTry = modelData.data.map(m => m.id || m.name).filter(Boolean);
                      console.log(`Fetched models from ${baseUrl}/models: ${modelsToTry.join(', ')}`);
                    }
                  }
                } catch (e) {
                  console.log(`Could not fetch models from ${baseUrl}/models: ${e.message}`);
                }

                if (modelsToTry.length === 0) {
                  modelsToTry = [
                    'claude-3-5-sonnet',
                    'opencode/claude-3-5-sonnet',
                    'deepseek-chat',
                    'deepseek-coder',
                    'gpt-4o-mini',
                    'gpt-4o'
                  ];
                }

                const chatUrl = `${baseUrl}/chat/completions`;

                for (const modelName of modelsToTry) {
                  if (reviewContent) break;
                  try {
                    const res = await fetch(chatUrl, {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${opencodeKey.trim()}`
                      },
                      body: JSON.stringify({
                        model: modelName,
                        messages: [
                          { role: 'system', content: 'You are an expert code reviewer. Perform an exhaustive review covering code patterns, architecture, bugs, performance, security, and feature recommendations.' },
                          { role: 'user', content: prompt }
                        ],
                        max_tokens: 3500
                      })
                    });
                    const data = await res.json();
                    if (data.choices?.[0]?.message?.content) {
                      reviewContent = data.choices[0].message.content;
                      usedModelName = `OpenCode (${modelName})`;
                      break;
                    } else if (data.error) {
                      const errMsg = `OpenCode (${chatUrl} - ${modelName}) Error [${res.status}]: ${data.error.message || JSON.stringify(data.error)}`;
                      console.error(errMsg);
                      apiErrors.push(errMsg);
                    }
                  } catch (e) {
                    const errMsg = `Failed to call OpenCode (${chatUrl} - ${modelName}): ${e.message}`;
                    console.error(errMsg);
                    apiErrors.push(errMsg);
                  }
                }
              }
            }

            // Fallback to Anthropic API if OpenCode did not succeed but Anthropic API key is available
            if (!reviewContent && anthropicKey) {
              try {
                const res = await fetch("https://api.anthropic.com/v1/messages", {
                  method: "POST",
                  headers: {
                    "x-api-key": anthropicKey.trim(),
                    "anthropic-version": "2023-06-01",
                    "content-type": "application/json"
                  },
                  body: JSON.stringify({
                    model: "claude-3-5-sonnet-20241022",
                    max_tokens: 3500,
                    system: "You are an expert code reviewer. Perform an exhaustive review covering code patterns, architecture, bugs, performance, security, and feature recommendations.",
                    messages: [{ role: "user", content: prompt }]
                  })
                });
                const data = await res.json();
                if (data.content?.[0]?.text) {
                  reviewContent = data.content[0].text;
                  usedModelName = 'Claude (claude-3-5-sonnet)';
                } else if (data.error) {
                  apiErrors.push(`Anthropic API Error: ${data.error.message || JSON.stringify(data.error)}`);
                }
              } catch (e) {
                apiErrors.push(`Anthropic API Exception: ${e.message}`);
              }
            }

            if (!reviewContent) {
              const statusOpenCode = opencodeKey
                ? '✅ `OPENCODE_API_KEY` (Provided)'
                : '❌ `OPENCODE_API_KEY` (Missing)';
              const statusAnthropic = anthropicKey
                ? '✅ `ANTHROPIC_API_KEY` (Provided)'
                : '❌ `ANTHROPIC_API_KEY` (Missing)';

              const errorDetails = apiErrors.length > 0
                ? `\n\n**API Error Logs:**\n` + apiErrors.map(e => `- ⚠️ ${e}`).join('\n')
                : '';

              reviewContent = `### ⚠️ AI Code Reviewer Execution Issue\n\n` +
                `An automated AI code review was triggered for this Pull Request, but the API call failed or returned an error.\n\n` +
                `**Secret Status:**\n- ${statusOpenCode}\n- ${statusAnthropic}` +
                `${errorDetails}\n\n` +
                `**Troubleshooting:**\n` +
                `1. Check if the secret named \`OPENCODE_API_KEY\` or \`ANTHROPIC_API_KEY\` in GitHub Secrets is valid.\n` +
                `2. Re-trigger by commenting \`@opencode\` or \`@ai\` or \`@claude\` on this PR.\n\n` +
                `*PR Diff Size:* ${diff.length} characters analyzed.`;
            }

            const headerMarker = '<!-- AI_CODE_REVIEW_GATE_BOT -->';
            const header = `## 🤖 AI Code Review ${usedModelName ? `(${usedModelName})` : ''}`;
            const commentBody = `${headerMarker}\n${header}\n\n${reviewContent}`;

            // List comments to update existing or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number
            });

            const existingComment = comments.find(c => c.body && (c.body.includes(headerMarker) || c.body.startsWith('## 🤖 AI Code Review')));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: commentBody
              });
            }

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.0"

      - name: Run Tests with Coverage
        continue-on-error: true
        run: |
          ./rebar3 as test ct --dir test/suites --cover || true
          ./rebar3 as test cover | tee coverage.log || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage.log
            _build/test/cover
          if-no-files-found: ignore
          retention-days: 30

      - name: Post coverage comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const pull_number = context.payload.pull_request
              ? context.payload.pull_request.number
              : (context.payload.issue ? context.payload.issue.number : null);

            if (!pull_number) {
              console.log('No PR number associated with this trigger event.');
              return;
            }

            let linesPct = 0, stmtsPct = 0, funcsPct = 0, branchPct = 0, overallPct = 0;
            let foundData = false;
            let detailsContent = '';

            // 1. Check coverage/coverage-summary.json
            const jsonPath = 'coverage/coverage-summary.json';
            if (fs.existsSync(jsonPath)) {
              try {
                const t = JSON.parse(fs.readFileSync(jsonPath, 'utf8')).total;
                linesPct = t.lines ? t.lines.pct : 0;
                stmtsPct = t.statements ? t.statements.pct : 0;
                funcsPct = t.functions ? t.functions.pct : 0;
                branchPct = t.branches ? t.branches.pct : 0;
                const calcOverall = (d) => (d.lines.covered !== undefined && (d.lines.total + d.statements.total + d.functions.total + d.branches.total) > 0)
                  ? Math.round(((d.lines.covered + d.statements.covered + d.functions.covered + d.branches.covered) / (d.lines.total + d.statements.total + d.functions.total + d.branches.total) * 100) * 100) / 100
                  : Math.round(((d.lines.pct + d.statements.pct + d.functions.pct + d.branches.pct) / 4) * 100) / 100;
                overallPct = calcOverall(t);
                foundData = true;
              } catch (e) {
                console.log('Error parsing coverage-summary.json: ' + e.message);
              }
            }

            // 2. Check coverage.log (Erlang rebar3 cover)
            const logPath = 'coverage.log';
            if (!foundData && fs.existsSync(logPath)) {
              try {
                const logContent = fs.readFileSync(logPath, 'utf8');
                detailsContent = logContent;
                const match = logContent.match(/\|\s*total\s*\|\s*(\d+)%\s*\|/i);
                if (match) {
                  overallPct = parseInt(match[1], 10);
                  linesPct = overallPct;
                  stmtsPct = overallPct;
                  funcsPct = overallPct;
                  branchPct = overallPct;
                  foundData = true;
                }
              } catch (e) {
                console.log('Error reading coverage.log: ' + e.message);
              }
            }

            if (!foundData) {
              const headerMarker = '<!-- CODE_COVERAGE_REPORT_BOT -->';
              const errorBody = `${headerMarker}\n❌ **Coverage report not found** — tests failed or produced no coverage data.`;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull_number
              });
              const existing = comments.find(c => c.body && (c.body.includes(headerMarker) || c.body.includes('Coverage Report')));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: errorBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pull_number,
                  body: errorBody
                });
              }
              return;
            }

            const ok = (v, threshold) => v >= threshold ? '✅' : '❌';
            const passed = overallPct >= 80;
            const statusIcon = overallPct > 80 ? '🟢' : (overallPct >= 50 ? '🟡' : '🔴');
            const colorName = overallPct > 80 ? 'brightgreen' : (overallPct >= 50 ? 'yellow' : 'red');
            const badgeUrl = `https://img.shields.io/badge/Coverage-${overallPct}%25-${colorName}?style=for-the-badge&logo=codecov`;

            const headerMarker = '<!-- CODE_COVERAGE_REPORT_BOT -->';
            const bodyLines = [
              headerMarker,
              `## 📊 Code Coverage Report`,
              ``,
              `![Coverage Badge](${badgeUrl})`,
              ``,
              passed
                ? '✅ **Coverage Gate Passed — PR can be merged (≥80% coverage)**'
                : '❌ **Coverage Gate FAILED — add more tests (need ≥80% coverage)**',
              '',
              '| Metric | Coverage | Required | Status |',
              '|---|---|---|---|',
              `| Lines      | ${linesPct}%      | 80% | ${ok(linesPct, 80)} |`,
              `| Statements | ${stmtsPct}% | 80% | ${ok(stmtsPct, 80)} |`,
              `| Functions  | ${funcsPct}%  | 80% | ${ok(funcsPct, 80)} |`,
              `| Branches   | ${branchPct}%   | 70% | ${ok(branchPct, 70)} |`,
              `| **Overall**| **${overallPct}%**   | **80%** | **${ok(overallPct, 80)}** |`,
            ];

            if (detailsContent) {
              bodyLines.push('', '### 📄 Coverage Log Details', '```', detailsContent, '```');
            }

            const commentBody = bodyLines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull_number
            });

            const existingComment = comments.find(c => c.body && (c.body.includes(headerMarker) || c.body.includes('Coverage Report')));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull_number,
                body: commentBody
              });
            }

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json,./coverage.log
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
