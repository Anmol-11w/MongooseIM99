name: Fast Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
# =====================================================
# DOCKER IMAGE BUILD
# =====================================================
  docker_image:
    name: Build & Push Docker Image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare image tags
        id: image
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/${REPO_LC}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH_TAG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "run_tag=${IMAGE}:run-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${IMAGE}:${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            echo "latest_tag=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app Docker image
        run: docker build --tag "${{ steps.image.outputs.sha_tag }}" .

      - name: Smoke test Docker image
        run: docker run --rm --entrypoint /usr/lib/mongooseim/bin/mongooseim "${{ steps.image.outputs.sha_tag }}" version --simple

      - name: Tag branch / run-number / latest images
        run: |
          docker tag "${{ steps.image.outputs.sha_tag }}" "${{ steps.image.outputs.branch_tag }}"
          docker tag "${{ steps.image.outputs.sha_tag }}" "${{ steps.image.outputs.run_tag }}"
          if [[ -n "${{ steps.image.outputs.latest_tag }}" ]]; then
            docker tag "${{ steps.image.outputs.sha_tag }}" "${{ steps.image.outputs.latest_tag }}"
          fi

      - name: Push image to GHCR
        run: |
          docker push "${{ steps.image.outputs.sha_tag }}"
          docker push "${{ steps.image.outputs.branch_tag }}"
          docker push "${{ steps.image.outputs.run_tag }}"
          if [[ -n "${{ steps.image.outputs.latest_tag }}" ]]; then
            docker push "${{ steps.image.outputs.latest_tag }}"
          fi

# =====================================================
# AUTO DEPLOY TO PRODUCTION
# =====================================================
  deploy:
    name: Deploy to production
    runs-on: ubuntu-22.04
    needs: docker_image
    if: github.ref_name == 'main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHORT_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
          DB_HOST: ${{ secrets.MIM_DB_HOST || secrets.DB_HOST }}
          DB_PORT: ${{ secrets.MIM_DB_PORT || secrets.DB_PORT }}
          DB_NAME: ${{ secrets.MIM_DB_NAME || secrets.DB_NAME }}
          DB_USER: ${{ secrets.MIM_DB_USER || secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.MIM_DB_PASSWORD || secrets.DB_PASSWORD }}
          XMPP_HOST: ${{ secrets.MIM_XMPP_HOST || secrets.XMPP_HOST }}
          JWT_PUBLIC_KEY: ${{ secrets.MIM_JWT_PUBLIC_KEY || secrets.JWT_PUBLIC_KEY }}
          TLS_CERT_PEM: ${{ secrets.MIM_TLS_CERT_PEM || secrets.TLS_CERT_PEM }}
          TLS_KEY_PEM: ${{ secrets.MIM_TLS_KEY_PEM || secrets.TLS_KEY_PEM }}
          RABBITMQ_HOST: ${{ secrets.MIM_RABBITMQ_HOST || secrets.RABBITMQ_HOST }}
          RABBITMQ_PORT: ${{ secrets.MIM_RABBITMQ_PORT || secrets.RABBITMQ_PORT }}
          RABBITMQ_USER: ${{ secrets.MIM_RABBITMQ_USER || secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.MIM_RABBITMQ_PASSWORD || secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_VHOST: ${{ secrets.MIM_RABBITMQ_VHOST || secrets.RABBITMQ_VHOST }}
          S3_BUCKET_URL: ${{ secrets.MIM_S3_BUCKET_URL || secrets.S3_BUCKET_URL }}
          S3_REGION: ${{ secrets.MIM_S3_REGION || secrets.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.MIM_S3_ACCESS_KEY_ID || secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.MIM_S3_SECRET_ACCESS_KEY || secrets.S3_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SHORT_SHA,DEPLOY_REF,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,XMPP_HOST,JWT_PUBLIC_KEY,TLS_CERT_PEM,TLS_KEY_PEM,RABBITMQ_HOST,RABBITMQ_PORT,RABBITMQ_USER,RABBITMQ_PASSWORD,RABBITMQ_VHOST,S3_BUCKET_URL,S3_REGION,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY
          script: |
            set -euo pipefail

            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            cd /opt/MongooseIM99

            REMOTE="origin"
            if git remote get-url ci &>/dev/null; then
              REMOTE="ci"
            fi
            echo "📥 Fetching code from remote '$REMOTE' ($DEPLOY_REF)..."
            git fetch "$REMOTE" "${DEPLOY_REF}"
            git checkout "${DEPLOY_REF}" || git checkout -b "${DEPLOY_REF}" "${REMOTE}/${DEPLOY_REF}"
            git reset --hard "${REMOTE}/${DEPLOY_REF}"

            SHORT_SHA="${SHORT_SHA:0:7}"
            MIM_NS="mim"
            APP_DEPLOY="mim-mongooseim"
            PG_DEPLOY="mim-mongooseim-postgresql"
            REDIS_DEPLOY="mim-mongooseim-redis"
            RMQ_DEPLOY="mim-mongooseim-rabbitmq"

            # ✅ Validate all required secrets are present before doing anything
            MISSING=""
            [[ -z "$DB_HOST" ]]        && MISSING="$MISSING DB_HOST"
            [[ -z "$DB_PASSWORD" ]]    && MISSING="$MISSING DB_PASSWORD"
            [[ -z "$XMPP_HOST" ]]      && MISSING="$MISSING XMPP_HOST"
            [[ -z "$TLS_CERT_PEM" ]]   && MISSING="$MISSING TLS_CERT_PEM"
            [[ -z "$TLS_KEY_PEM" ]]    && MISSING="$MISSING TLS_KEY_PEM"
            if [[ -n "$MISSING" ]]; then
              echo "❌ Missing required secrets:$MISSING"
              echo "   Set these in GitHub → Settings → Secrets and variables → Actions"
              exit 1
            fi
            echo "✅ All required secrets present"

            get_generation() {
              kubectl get deployment "$1" -n "$MIM_NS" \
                -o jsonpath='{.metadata.generation}' 2>/dev/null || echo "absent"
            }

            PG_GEN_BEFORE="$(get_generation "$PG_DEPLOY")"
            REDIS_GEN_BEFORE="$(get_generation "$REDIS_DEPLOY")"
            RMQ_GEN_BEFORE="$(get_generation "$RMQ_DEPLOY")"

            # ✅ Pre-clean unmanaged RabbitMQ deployment to prevent Helm selector conflicts
            echo "🧹 Ensuring clean state for RabbitMQ deployment..."
            kubectl delete deployment "${RMQ_DEPLOY}" -n "$MIM_NS" --ignore-not-found=true

            # ✅ Deploy image via Helm first so deployment exists
            echo "🚀 Deploying image: ghcr.io/anmol-11w/mongooseim99:sha-${SHORT_SHA}"
            helm upgrade --install mim ./helm/mongooseim \
             --namespace "$MIM_NS" \
             --cleanup-on-fail \
             -f helm/mongooseim/values.yaml \
             --set image.repository="ghcr.io/anmol-11w/mongooseim99" \
             --set image.tag="sha-${SHORT_SHA}" \
             --set image.pullPolicy="Always" \
             --set rabbitmqBackend.host="${RABBITMQ_HOST:-mim-mongooseim-rabbitmq}" \
             --set rabbitmqBackend.port="${RABBITMQ_PORT:-5672}" \
             --set rabbitmqBackend.username="${RABBITMQ_USER:-mongooseim}" \
             --set rabbitmqBackend.password="${RABBITMQ_PASSWORD:-mongooseim_secret}" \
             --set rabbitmqBackend.vhost="${RABBITMQ_VHOST:-mongooseim}" \
             --set rabbitmq.username="${RABBITMQ_USER:-mongooseim}" \
             --set rabbitmq.password="${RABBITMQ_PASSWORD:-mongooseim_secret}" \
             --set rabbitmq.vhost="${RABBITMQ_VHOST:-mongooseim}"

            # ✅ Inject all secrets as env vars on the MongooseIM deployment
            echo "🔐 Injecting secrets as pod environment variables..."
            kubectl set env deployment/${APP_DEPLOY} -n "$MIM_NS" \
              MIM_DB_HOST="${DB_HOST}" \
              MIM_DB_PORT="${DB_PORT:-5432}" \
              MIM_DB_NAME="${DB_NAME}" \
              MIM_DB_USER="${DB_USER}" \
              MIM_DB_PASSWORD="${DB_PASSWORD}" \
              MIM_XMPP_HOST="${XMPP_HOST}" \
              MIM_JWT_PUBLIC_KEY="${JWT_PUBLIC_KEY}" \
              MIM_TLS_CERT_PEM="${TLS_CERT_PEM}" \
              MIM_TLS_KEY_PEM="${TLS_KEY_PEM}" \
              MIM_RABBITMQ_HOST="${RABBITMQ_HOST:-mim-mongooseim-rabbitmq}" \
              MIM_RABBITMQ_PORT="${RABBITMQ_PORT:-5672}" \
              MIM_RABBITMQ_USER="${RABBITMQ_USER:-mongooseim}" \
              MIM_RABBITMQ_PASSWORD="${RABBITMQ_PASSWORD:-mongooseim_secret}" \
              MIM_RABBITMQ_VHOST="${RABBITMQ_VHOST:-mongooseim}" \
              MIM_S3_BUCKET_URL="${S3_BUCKET_URL:-}" \
              MIM_S3_REGION="${S3_REGION:-}" \
              MIM_S3_ACCESS_KEY_ID="${S3_ACCESS_KEY_ID:-}" \
              MIM_S3_SECRET_ACCESS_KEY="${S3_SECRET_ACCESS_KEY:-}"
            echo "✅ Secrets injected as env vars"

            # Force restart so new deployment.yaml startup script runs in pods
            echo "🔄 Restarting pods to apply new startup script..."
            kubectl rollout restart deployment/${APP_DEPLOY} -n "$MIM_NS"

            echo "⏳ Waiting for rollout to complete..."
            if ! kubectl rollout status deployment/${APP_DEPLOY} -n "$MIM_NS" --timeout=300s; then
              echo "❌ FAILED: rollout timed out"
              kubectl get pods -n "$MIM_NS" -o wide || true
              exit 1
            fi
            echo "✅ Rollout complete"

            # ✅ Log backend deployment status
            PG_GEN_AFTER="$(get_generation "$PG_DEPLOY")"
            REDIS_GEN_AFTER="$(get_generation "$REDIS_DEPLOY")"
            RMQ_GEN_AFTER="$(get_generation "$RMQ_DEPLOY")"

            echo "ℹ️ PostgreSQL generation: $PG_GEN_BEFORE -> $PG_GEN_AFTER"
            echo "ℹ️ Redis generation: $REDIS_GEN_BEFORE -> $REDIS_GEN_AFTER"
            echo "ℹ️ RabbitMQ generation: $RMQ_GEN_BEFORE -> $RMQ_GEN_AFTER"

            echo "✅ Backend deployments (PostgreSQL, Redis, RabbitMQ) unchanged"
            echo ""
            echo "✅ Deployment complete!"
            echo ""
            echo "📦 Running pods:"
            kubectl get pods -n "$MIM_NS"

# =====================================================
# MONITORING DEPLOY
# =====================================================
  deploy_monitoring:
    name: Deploy monitoring stack
    runs-on: ubuntu-22.04
    needs: docker_image
    if: github.ref_name == 'main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if monitoring changed
        id: check
        run: |
          if git diff HEAD~1 HEAD -- monitoring-values.yaml | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy monitoring via SSH
        if: steps.check.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            cd /opt/MongooseIM99
            helm repo add grafana https://grafana.github.io/helm-charts || true
            helm repo update
            helm upgrade --install loki grafana/loki-stack \
              --namespace monitoring \
              --create-namespace \
              -f monitoring-values.yaml

