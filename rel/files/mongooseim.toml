[general]
  loglevel = "warning"
  hosts = [{{{hosts}}}]
  host_types = [{{{host_types}}}]
  default_server_domain = {{{default_server_domain}}}
  registration_timeout = "infinity"
  language = "en"
  {{#sm_backend}}
  sm_backend = {{{sm_backend}}}
  {{/sm_backend}}
  {{#component_backend}}
  component_backend = {{{component_backend}}}
  {{/component_backend}}
  {{#s2s_backend}}
  s2s_backend = {{{s2s_backend}}}
  {{/s2s_backend}}
  {{#http_server_name}}
  http_server_name = {{{http_server_name}}}
  {{/http_server_name}}

[[listen.http]]
  port = {{{http_port}}}
  transport.num_acceptors = 10
  transport.max_connections = 1024

  [[listen.http.handlers.mongoose_bosh_handler]]
    host = "_"
    path = "/http-bind"

  [[listen.http.handlers.mongoose_websocket_handler]]
    host = "_"
    path = "/ws-xmpp"


[[listen.http]]
  port = {{{https_port}}}
  transport.num_acceptors = 10
  transport.max_connections = 1024
  {{#https_config}}
  {{{https_config}}}
  {{/https_config}}

  [[listen.http.handlers.mongoose_bosh_handler]]
    host = "_"
    path = "/http-bind"

  [[listen.http.handlers.mongoose_websocket_handler]]
    host = "_"
    path = "/ws-xmpp"

[[listen.http]]
  {{#http_graphql_api_admin_endpoint}}
  {{{http_graphql_api_admin_endpoint}}}
  {{/http_graphql_api_admin_endpoint}}
  transport.num_acceptors = 10
  transport.max_connections = 1024

  [[listen.http.handlers.mongoose_graphql_handler]]
    host = "localhost"
    path = "/api/graphql"
    schema_endpoint = "admin"
    username = "admin"
    password = "secret"

[[listen.http]]
  {{#http_graphql_api_domain_admin_endpoint}}
  {{{http_graphql_api_domain_admin_endpoint}}}
  {{/http_graphql_api_domain_admin_endpoint}}
  transport.num_acceptors = 10
  transport.max_connections = 1024

  [[listen.http.handlers.mongoose_graphql_handler]]
    host = "_"
    path = "/api/graphql"
    schema_endpoint = "domain_admin"

[[listen.http]]
  {{#http_graphql_api_user_endpoint}}
  {{{http_graphql_api_user_endpoint}}}
  {{/http_graphql_api_user_endpoint}}
  transport.num_acceptors = 10
  transport.max_connections = 1024

  [[listen.http.handlers.mongoose_graphql_handler]]
    host = "_"
    path = "/api/graphql"
    schema_endpoint = "user"
{{#http_prometheus_endpoint}}

[[listen.http]]
  {{{http_prometheus_endpoint}}}
  transport.num_acceptors = 10

  [[listen.http.handlers.mongoose_prometheus_handler]]
    host = "_"
    path = "/metrics"
{{/http_prometheus_endpoint}}

[[listen.c2s]]
  port = {{{c2s_port}}}
  access = "c2s"
  shaper = "normal"
  max_stanza_size = 10485760
  {{#tls_config}}
  {{{tls_config}}}
  {{/tls_config}}
  {{#c2s_dhfile}}
  tls.dhfile = {{{c2s_dhfile}}}
  {{/c2s_dhfile}}
  {{#allowed_auth_methods}}
  allowed_auth_methods = [{{{allowed_auth_methods}}}]
  {{/allowed_auth_methods}}
{{#secondary_c2s}}

{{{secondary_c2s}}}
{{/secondary_c2s}}

[[listen.s2s]]
  port = {{{incoming_s2s_port}}}
  shaper = "fast"
  max_stanza_size = 131072
  {{#tls_config}}
  {{{tls_config}}}
  {{/tls_config}}
  {{#s2s_dhfile}}
  tls.dhfile = {{{s2s_dhfile}}}
  {{/s2s_dhfile}}
{{#listen_component}}

{{{listen_component}}}
{{/listen_component}}

[auth]
  {{#cyrsasl_external}}
  sasl_external = [{{{cyrsasl_external}}}]
  {{/cyrsasl_external}}
  {{#sasl_mechanisms}}
  sasl_mechanisms = [{{{sasl_mechanisms}}}]
  {{/sasl_mechanisms}}
  {{#auth_password_opts}}

  [auth.password]
    {{{auth_password_opts}}}
  {{/auth_password_opts}}
  {{#auth_method}}

  # methods
  [auth.{{{auth_method}}}]{{#auth_method_opts}}
    {{{auth_method_opts}}}{{/auth_method_opts}}
  {{/auth_method}}

{{{internal_databases}}}

{{#outgoing_pools}}
{{{outgoing_pools}}}
{{/outgoing_pools}}
{{^outgoing_pools}}
[outgoing_pools.http.ai_bot]
  scope = "global"
  workers = 5

[outgoing_pools.http.ai_bot.connection]
  host = "https://api.openai.com"
  path_prefix = "/v1"
  request_timeout = 30000
  tls.verify_mode = "none"


[outgoing_pools.rdbms.default]
  scope = "global"
  workers = 5

  [outgoing_pools.rdbms.default.connection]
    driver = "pgsql"
    port = 5433
    host = "localhost"
    database = "mongooseim"
    username = "mongooseim"
    password = "mongooseim_secret"
    tls.required = false
{{/outgoing_pools}}

[services.service_bosh]
  {{#bosh_backend}}
  backend = {{{bosh_backend}}}
  {{/bosh_backend}}

